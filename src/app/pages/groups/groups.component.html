<app-navbar />

<main class="bg-body-tertiary min-vh-100">
  <section class="container py-5">
    <div class="pt-5 mt-4">
      <div class="mb-4">
        <span class="badge text-bg-primary mb-2">Groups</span>
        <h1 class="h2 fw-bold mb-1">All WhatsApp Groups</h1>
        <p class="text-secondary mb-0">Save group participants into your clients list.</p>
      </div>

      <div *ngIf="loadingGroups" class="d-flex align-items-center gap-2 alert alert-light border">
        <span class="spinner-border spinner-border-sm text-primary" aria-hidden="true"></span>
        <span>Loading groups...</span>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
      <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>

      <div *ngIf="groupData.length === 0 && !loadingGroups && !errorMessage" class="alert alert-info">
        No groups found.
      </div>

      <div class="row g-3">
        <div *ngFor="let group of groupData" class="col-xl-3 col-lg-4 col-md-6">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="d-flex align-items-start justify-content-between gap-3">
                <div>
                  <small class="text-secondary">Group</small>
                  <h2 class="h6 fw-bold text-primary mb-3">{{ group.name }}</h2>
                  <small class="text-secondary d-block">Participants</small>
                  <span class="badge text-bg-light">{{ group.participantCount }}</span>
                </div>

                <button
                  class="btn btn-primary btn-sm"
                  *ngIf="loadingGroupId !== group.id"
                  (click)="saveParticipants(group.id)"
                >
                  Save
                </button>
                <span
                  *ngIf="loadingGroupId === group.id"
                  class="spinner-border spinner-border-sm text-primary"
                  role="status"
                >
                  <span class="visually-hidden">Loading...</span>
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<app-footer />

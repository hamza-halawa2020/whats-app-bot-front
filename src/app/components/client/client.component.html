<div class="row justify-content-center g-4">
    <div *ngFor="let item of clientData" class="col-lg-4 col-md-6 col-sm-12">
        <div class="item-box card h-100 border-0 shadow-sm">
            <div class="smart-tes-author p-4">
                <div class="st-author-box text-center">
                    <div class="st-author-thumb position-relative d-inline-block">
                        <div class="quotes position-absolute top-0 start-0" [ngClass]="item.quote">
                            <i class="fa-solid fa-quote-left"></i>
                        </div>
                        <img [src]="item.image" class="img-fluid rounded-circle" alt="" style="width: 80px; height: 80px; object-fit: cover;" />
                    </div>
                </div>
            </div>
            <div class="smart-tes-content px-4">
                <p class="text-muted">{{item.desc}}</p>
            </div>
            <div class="st-author-info p-4 pt-0 text-center">
                <h5 class="st-author-title mb-1">{{item.name}}</h5>
                <span class="st-author-subtitle text-muted">{{item.position}}</span>
            </div>
        </div>
    </div>
</div>

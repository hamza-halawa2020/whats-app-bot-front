<div class="modal fade" id="login" tabindex="-1" aria-labelledby="loginTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered login-modal">
        <div class="modal-content">
            <button type="button" class="login-close" data-bs-dismiss="modal" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="modal-body">
                <div class="login-brand">
                    <img src="/assets/img/whatsapp-sender-logo.svg" alt="WhatsApp Sender" />
                    <div>
                        <h4 id="loginTitle">Welcome back</h4>
                        <p>Sign in to continue sending messages.</p>
                    </div>
                </div>

                <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
                    <div class="field-group">
                        <label for="loginEmail">Email</label>
                        <input
                            id="loginEmail"
                            type="email"
                            class="form-control"
                            formControlName="email"
                            placeholder="name@example.com"
                        />
                        <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']">
                            Email is required
                        </small>
                        <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']">
                            Enter a valid email
                        </small>
                    </div>

                    <div class="field-group">
                        <label for="loginPassword">Password</label>
                        <div class="password-field">
                            <input
                                id="loginPassword"
                                [type]="showPassword ? 'text' : 'password'"
                                class="form-control"
                                formControlName="password"
                                placeholder="Your password"
                            />
                            <button type="button" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility">
                                <i [class]="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
                            </button>
                        </div>
                        <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']">
                            Password is required
                        </small>
                        <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['minlength']">
                            Password must be at least 6 characters
                        </small>
                    </div>

                    <div *ngIf="loginError" class="login-error">{{ loginError }}</div>

                    <button type="submit" class="btn btn-primary login-submit" [disabled]="loginForm.invalid || isSubmitting">
                        {{ isSubmitting ? 'Signing in...' : 'Sign in' }}
                    </button>
                </form>

                <p class="login-footer">
                    New here?
                    <button type="button" (click)="navigateToRegister()">Create account</button>
                </p>
            </div>
        </div>
    </div>
</div>
